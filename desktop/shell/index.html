<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ormah</title>
    <style>
      /* Tokens mirror ormah-web (globals.css) so the install flow and the graph
         it hands off to read as one product. */
      :root {
        --bg: #0a0a0a;
        --bg-raised: #141414;
        --surface: #161616;
        --border: #242424;
        --border-light: #333;
        --text: #999;
        --text-bright: #ccc;
        --text-muted: #555;
        --accent: #d4a574;                 /* gold — the wordmark */
        --accent-dim: rgba(212, 165, 116, 0.15);
        --node: #74b3a5;                    /* teal — the self / memory node */
        --node-border: #8fd4c4;
        --node-glow: 0 0 6px var(--node), 0 0 16px rgba(116, 179, 165, 0.35);
        --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Menlo, monospace;
        --mark: "Century Gothic", "CenturyGothic", "AppleGothic", "Futura", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--mono);
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
        display: flex; align-items: center; justify-content: center;
      }

      /* ---- the void: layered ambient glows + starfield ---- */
      .void { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(40% 30% at 50% 30%, rgba(212,165,116,0.06), transparent 70%),
          radial-gradient(35% 28% at 50% 62%, rgba(116,179,165,0.05), transparent 70%);
        will-change: transform;
      }
      .stars i {
        position: absolute; border-radius: 50%; background: #d8d8d8;
        animation: twinkle 5s ease-in-out infinite;
      }
      @keyframes twinkle { 0%,100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * 0.25); } }

      .stage {
        position: relative; z-index: 1;
        width: 100%; max-width: 480px; padding: 40px;
        text-align: center;
      }

      /* ---- the mark: ormah wordmark + hovering teal node under the "r" ---- */
      .mark { margin-bottom: 8px; }
      .wordmark {
        font-family: var(--mark); font-weight: 400; color: var(--accent);
        font-size: 60px; letter-spacing: 0.005em; line-height: 1;
        display: inline-flex; text-shadow: 0 0 44px rgba(212,165,116,0.22);
      }
      .wordmark .ch {
        display: inline-block; position: relative;
        opacity: 0; transform: translateY(18px);
        animation: rise .6s cubic-bezier(.25,.46,.45,.94) forwards;
      }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      .node {
        position: absolute; left: 25%; bottom: -5px;
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--node); box-shadow: var(--node-glow);
        opacity: 0; transform: translateX(-50%);
        animation: nodeIn .5s ease-out 1.0s forwards, hover 3.6s ease-in-out 1.6s infinite;
      }
      @keyframes nodeIn { to { opacity: 1; } }
      @keyframes hover {
        0%, 100% { transform: translate(-50%, 0); }
        50%      { transform: translate(-50%, -7px); }
      }
      .tagline {
        margin-top: 14px; font-size: 11px; letter-spacing: 0.36em;
        text-transform: uppercase; color: var(--text-muted);
        opacity: 0; animation: fadeIn .8s ease 1.2s forwards;
      }

      /* ---- acts ---- */
      .act { display: none; margin-top: 40px; }
      .act.on { display: block; animation: fadeUp .45s ease; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
      @keyframes fadeIn { to { opacity: 1; } }

      h2 {
        font-family: var(--mark); font-weight: 400; color: var(--text-bright);
        font-size: 19px; margin: 0 0 10px; letter-spacing: 0.01em;
      }
      .lead { color: var(--text); font-size: 13px; line-height: 1.7; margin: 0 auto; max-width: 380px; }
      .muted { color: var(--text-muted); font-size: 12px; }

      /* boot sweep */
      .sweep { height: 1px; width: 220px; margin: 26px auto 0;
               background: var(--border); position: relative; overflow: hidden; }
      .sweep::after { content: ""; position: absolute; inset: 0; width: 40%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: sweep 1.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

      /* ---- detected-tools ledger ---- */
      .ledger { margin: 24px auto 0; max-width: 360px; text-align: left; }
      .tool {
        display: flex; align-items: center; gap: 12px;
        padding: 13px 4px; border-bottom: 1px solid var(--border);
        opacity: 0; transform: translateX(-6px);
        animation: rowIn .4s ease forwards;
      }
      @keyframes rowIn { to { opacity: 1; transform: translateX(0); } }
      .tool .dot {
        width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto;
        background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-light);
        transition: all .3s ease;
      }
      .tool.found .dot { background: var(--node); box-shadow: var(--node-glow); }
      .tool .name { flex: 1; font-size: 13px; color: var(--text-muted); }
      .tool.found .name { color: var(--text-bright); }
      .tool .state { font-size: 11px; letter-spacing: 0.04em; color: var(--text-muted); }
      .tool.found .state { color: var(--node-border); }

      .actions { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
      button {
        font-family: var(--mono); font-size: 13px; cursor: pointer;
        padding: 11px 22px; border-radius: 7px; border: 0;
        transition: filter .15s ease, box-shadow .2s ease, color .15s ease;
      }
      .primary { background: var(--accent); color: #1b1305; font-weight: 600;
                 box-shadow: 0 0 0 rgba(212,165,116,0); }
      .primary:hover { filter: brightness(1.07); box-shadow: 0 0 24px rgba(212,165,116,0.25); }
      .ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--border-light); }
      .ghost:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; filter: none; box-shadow: none; }

      .status { margin-top: 18px; font-size: 12px; color: var(--text-muted); min-height: 16px; }

      @media (prefers-reduced-motion: reduce) {
        .ch, .node, .tagline, .act, .tool { animation-duration: .001s !important; }
        .node { animation: nodeIn .001s forwards !important; }
        .sweep::after, .stars i, .glow { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="void">
      <div class="glow" id="glow"></div>
      <div class="stars" id="stars"></div>
    </div>

    <div class="stage">
      <div class="mark">
        <span class="wordmark" id="wordmark"></span>
        <div class="tagline">memory for your agents</div>
      </div>

      <!-- ACT: boot -->
      <section class="act on" id="act-boot">
        <h2>Waking up your memory</h2>
        <p class="lead" id="boot-lead">Starting your local server. Nothing leaves this machine.</p>
        <div class="sweep"></div>
        <div class="status" id="boot-status">First launch downloads the memory models — one time.</div>
      </section>

      <!-- ACT: connect -->
      <section class="act" id="act-connect">
        <h2 id="connect-title">Looking around your machine</h2>
        <p class="lead" id="connect-lead">Finding the AI tools Ormah can connect to.</p>
        <div class="ledger" id="ledger"></div>
        <div class="actions" id="connect-actions" style="display:none">
          <button class="primary" id="btn-connect">Connect them</button>
          <button class="ghost" id="btn-skip">Skip</button>
        </div>
        <div class="status" id="connect-status"></div>
      </section>

      <!-- ACT: open -->
      <section class="act" id="act-open">
        <h2>Opening your graph</h2>
        <p class="lead">Your memory is ready. Loading the graph here.</p>
        <div class="status" id="open-status"></div>
        <div class="actions"><button class="primary" id="btn-open">Open now</button></div>
      </section>
    </div>

    <script>
      // ---- wordmark with the hovering node under the "r" (index 1) ----
      (function () {
        const wm = document.getElementById("wordmark");
        "ormah".split("").forEach((c, i) => {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c;
          s.style.animationDelay = (0.3 + i * 0.08) + "s";
          if (i === 1) { const n = document.createElement("span"); n.className = "node"; s.appendChild(n); }
          wm.appendChild(s);
        });
      })();

      // ---- starfield (depth via size/opacity tiers) ----
      const starEls = [];
      (function () {
        const box = document.getElementById("stars");
        for (let i = 0; i < 46; i++) {
          const s = document.createElement("i");
          const tier = Math.random();
          const size = tier > 0.85 ? 2.4 : tier > 0.5 ? 1.6 : 1;
          s.style.width = s.style.height = size + "px";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          const o = (0.05 + Math.random() * 0.22).toFixed(2);
          s.style.setProperty("--o", o);
          s.style.animationDelay = (Math.random() * 5) + "s";
          s.dataset.depth = (size / 2.4).toFixed(2);
          box.appendChild(s); starEls.push(s);
        }
      })();
      // subtle parallax: the void breathes with the cursor
      const glow = document.getElementById("glow");
      window.addEventListener("mousemove", (e) => {
        const dx = (e.clientX / window.innerWidth - 0.5);
        const dy = (e.clientY / window.innerHeight - 0.5);
        glow.style.transform = `translate(${dx * 14}px, ${dy * 14}px)`;
        for (const s of starEls) {
          const d = parseFloat(s.dataset.depth);
          s.style.marginLeft = (dx * 18 * d) + "px";
          s.style.marginTop = (dy * 18 * d) + "px";
        }
      });

      // ---- flow ----
      const TAURI = window.__TAURI__;
      const invoke = TAURI ? TAURI.core.invoke : async () => { throw new Error("no tauri"); };
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const act = (id) => {
        document.querySelectorAll(".act").forEach((a) => a.classList.remove("on"));
        $(id).classList.add("on");
      };

      const TOOLS = [
        { key: "claude_code", name: "Claude Code" },
        { key: "claude_desktop", name: "Claude Desktop" },
        { key: "codex", name: "Codex" },
      ];

      async function graphUrl() {
        try { return await invoke("graph_url"); } catch { return "http://127.0.0.1:8787"; }
      }
      async function gotoGraph() {
        act("act-open");
        const url = await graphUrl();
        $("open-status").textContent = url;
        await sleep(650);
        window.location.replace(url);
      }

      async function waitForServer() {
        for (let i = 0; i < 150; i++) {
          try { await invoke("fetch_stats"); return true; }
          catch {
            $("boot-status").textContent = i < 6
              ? "First launch downloads the memory models — one time."
              : "Still downloading the memory models…";
            await sleep(2000);
          }
        }
        $("boot-status").textContent = "The server is taking unusually long. Check the logs.";
        return false;
      }

      let detected = {};
      async function detectTools() {
        try { detected = await invoke("detect_agents"); } catch { detected = {}; }
        const found = TOOLS.filter((t) => detected[t.key]);
        $("connect-title").textContent = found.length ? "Found your AI tools" : "No AI tools found yet";
        $("connect-lead").textContent = found.length
          ? "One click wires hooks and MCP into each."
          : "Install Claude Code, Claude Desktop, or Codex, then reopen Ormah.";
        const ledger = $("ledger"); ledger.innerHTML = "";
        TOOLS.forEach((t, i) => {
          const ok = !!detected[t.key];
          const row = document.createElement("div");
          row.className = "tool" + (ok ? " found" : "");
          row.style.animationDelay = (0.08 * i) + "s";
          row.innerHTML =
            `<span class="dot"></span><span class="name">${t.name}</span>` +
            `<span class="state">${ok ? "ready to connect" : "not found"}</span>`;
          ledger.appendChild(row);
        });
        await sleep(300 + TOOLS.length * 90);
        const actions = $("connect-actions");
        actions.style.display = "flex";
        $("btn-connect").style.display = found.length ? "" : "none";
      }

      async function connect() {
        $("btn-connect").disabled = true; $("btn-skip").disabled = true;
        $("connect-status").textContent = "Wiring your tools…";
        try {
          const res = await invoke("setup_agents");
          const wired = (res.wired || []).map((k) => (TOOLS.find((t) => t.key === k) || {}).name || k);
          $("connect-status").textContent = wired.length ? "Connected " + wired.join(", ") : "Nothing to connect.";
        } catch (e) { $("connect-status").textContent = "Couldn't finish: " + e; }
        try { await invoke("mark_onboarded"); } catch {}
        await sleep(1100);
        gotoGraph();
      }

      $("btn-connect").addEventListener("click", connect);
      $("btn-skip").addEventListener("click", async () => {
        try { await invoke("mark_onboarded"); } catch {}
        gotoGraph();
      });
      $("btn-open").addEventListener("click", gotoGraph);

      (async () => {
        const ok = await waitForServer();
        if (!ok) return;
        let onboarded = false;
        try { onboarded = await invoke("is_onboarded"); } catch {}
        if (onboarded) { gotoGraph(); return; }
        act("act-connect");
        detectTools();
      })();
    </script>
  </body>
</html>
