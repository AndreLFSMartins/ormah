name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Free runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune --all --force || true

          echo "Disk after cleanup:"
          df -h
      - name: Install
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -q --durations=25
      - name: Report disk usage
        if: always()
        run: |
          df -h
          (du -h -d 2 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME/.cache/uv" .venv 2>/dev/null || true) | sort -hr | head -100

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src/ tests/

  # Eval gating is deliberately NOT in CI yet: the corpora are local-only
  # (real data, gitignored) and still growing, so fail-below bars would be
  # noise. Run `make eval` locally. Promote to CI once the corpus stabilises
  # and a public-safe corpus slice exists.
