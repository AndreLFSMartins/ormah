name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff (non-blocking — pre-existing findings; tighten once clean)
        run: uv run ruff check src/ tests/ || true

  # Eval gating is deliberately NOT in CI yet: the corpora are local-only
  # (real data, gitignored) and still growing, so fail-below bars would be
  # noise. Run `make eval` locally. Promote to CI once the corpus stabilises
  # and a public-safe corpus slice exists.
